<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: "JetBrains Mono", monospace;
    }
    #retry-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .retry-pkt {
      opacity: 0;
    }
  </style>
  <div id="root" data-composition-id="retry" data-width="1920" data-height="1080">
    <svg id="retry-svg" viewBox="0 0 1920 1080">
      <g id="retry-scene" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path id="retry-left" d="M440 540 H900" stroke="#7d8a94" stroke-width="6" pathLength="1" />
        <path id="retry-mid" d="M900 540 H1020" stroke="#7d8a94" stroke-width="6" />
        <path id="retry-right" d="M1020 540 H1470" stroke="#7d8a94" stroke-width="6" pathLength="1" />
        <path id="retry-heal" d="M900 540 H1020" stroke="#7ee2b8" stroke-width="6" opacity="0" />
        <g id="retry-x" stroke="#e6edf3" stroke-width="7" opacity="0">
          <path d="M938 518 L982 562 M982 518 L938 562" />
        </g>

        <!-- lia -->
        <g id="retry-lia">
          <rect x="260" y="480" width="180" height="120" rx="14" fill="#7ee2b8" stroke="none" />
          <text x="350" y="556" text-anchor="middle" font-size="64" font-weight="700" letter-spacing="-4" fill="#0d1117" stroke="none">lia</text>
        </g>
        <!-- retry arrow around the lia block -->
        <g id="retry-spin" stroke="#e6edf3" stroke-width="6">
          <path d="M310 400 A44 44 0 1 1 390 400" />
          <path d="M376 384 L392 402 L366 410" />
        </g>

        <!-- model -->
        <g id="retry-model" stroke="#e6edf3" stroke-width="4">
          <circle id="retry-ring" cx="1560" cy="540" r="90" fill="#0d1117" />
          <path d="M1560 540 L1615 540 M1560 540 L1577 592 M1560 540 L1516 572 M1560 540 L1516 508 M1560 540 L1577 488" stroke="#7d8a94" />
          <circle cx="1560" cy="540" r="16" fill="#e6edf3" />
          <circle cx="1615" cy="540" r="8" fill="#e6edf3" />
          <circle cx="1577" cy="592" r="8" fill="#e6edf3" />
          <circle cx="1516" cy="572" r="8" fill="#e6edf3" />
          <circle cx="1516" cy="508" r="8" fill="#e6edf3" />
          <circle cx="1577" cy="488" r="8" fill="#e6edf3" />
        </g>
        <circle id="retry-glow" cx="1560" cy="540" r="90" stroke="#7ee2b8" stroke-width="8" opacity="0" />

        <circle id="retry-p1" class="retry-pkt" cx="440" cy="540" r="14" fill="#7ee2b8" stroke="none" />
        <circle id="retry-p2" class="retry-pkt" cx="440" cy="540" r="14" fill="#7ee2b8" stroke="none" />
        <circle id="retry-p3" class="retry-pkt" cx="440" cy="540" r="14" fill="#7ee2b8" stroke="none" />

        <text id="retry-label" x="960" y="800" text-anchor="middle" font-size="52" font-weight="700" fill="#e6edf3" stroke="none">retries</text>
      </g>
    </svg>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const burst = (id, at) => {
      tl.fromTo(id, { attr: { cx: 900, r: 14 }, opacity: 1 }, { attr: { cx: 900, r: 40 }, opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, at);
    };
    const spin = (at) => {
      tl.fromTo("#retry-spin", { rotation: 0, svgOrigin: "350 440" }, { rotation: 360, svgOrigin: "350 440", duration: 0.6, ease: "power2.inOut", immediateRender: false }, at);
    };
    const fly = (id, x1, at, dur) => {
      tl.set(id, { opacity: 1 }, at);
      tl.fromTo(id, { attr: { cx: 440 } }, { attr: { cx: x1 }, duration: dur, ease: "none", immediateRender: false }, at);
    };

    tl.fromTo("#retry-lia, #retry-model", { opacity: 0 }, { opacity: 1, duration: 0.5, stagger: 0.1 }, 0.1);
    tl.fromTo("#retry-left, #retry-right", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 0.2);
    tl.fromTo("#retry-mid", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.3);
    tl.fromTo("#retry-spin", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.4);
    tl.fromTo("#retry-label", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.5);

    // the line breaks
    tl.to("#retry-mid", { opacity: 0, duration: 0.15 }, 0.55);
    tl.fromTo("#retry-x", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.6);

    // attempt 1 and 2 hit the break
    fly("#retry-p1", 900, 0.8, 0.6);
    burst("#retry-p1", 1.4);
    spin(1.5);
    fly("#retry-p2", 900, 1.9, 0.6);
    burst("#retry-p2", 2.5);
    spin(2.6);

    // the line heals, attempt 3 gets through
    tl.fromTo("#retry-heal", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.75);
    tl.to("#retry-x", { opacity: 0, duration: 0.2 }, 2.75);
    fly("#retry-p3", 1470, 3.1, 1.0);
    tl.to("#retry-p3", { opacity: 0, duration: 0.1 }, 4.1);
    tl.fromTo("#retry-glow", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 4.1);

    tl.to("#retry-scene", { opacity: 0, duration: 0.4, ease: "power2.in" }, 4.6);
    window.__timelines["retry"] = tl;
  </script>
</template>
