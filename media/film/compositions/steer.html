<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: "JetBrains Mono", monospace;
    }
    #steer-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
  <div id="root" data-composition-id="steer" data-width="1920" data-height="1080">
    <svg id="steer-svg" viewBox="0 0 1920 1080">
      <g id="steer-scene" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polyline id="steer-line" points="" stroke="#7d8a94" stroke-width="6" />
        <circle id="steer-start" cx="260" cy="540" r="16" fill="#7d8a94" stroke="none" />
        <circle id="steer-end" cx="1660" cy="540" r="16" stroke="#7d8a94" stroke-width="6" fill="#0d1117" />

        <!-- model calls along the turn -->
        <circle id="steer-r0" cx="500" cy="540" r="22" stroke="#7d8a94" stroke-width="5" fill="#0d1117" />
        <circle id="steer-r1" cx="860" cy="540" r="22" stroke="#7d8a94" stroke-width="5" fill="#0d1117" />
        <circle id="steer-r2" cx="1220" cy="540" r="22" stroke="#7d8a94" stroke-width="5" fill="#0d1117" />
        <circle id="steer-r3" cx="1580" cy="540" r="22" stroke="#7d8a94" stroke-width="5" fill="#0d1117" />

        <circle id="steer-dot" cx="260" cy="540" r="16" fill="#7ee2b8" stroke="none" />

        <!-- the second arrow -->
        <g id="steer-arrow" stroke="none" opacity="0">
          <g transform="scale(1.7)"><path d="M0 40 V-12" stroke="#7ee2b8" stroke-width="10" />
          <path d="M-26 -14 H26 L0 -54 Z" fill="#7ee2b8" /></g>
        </g>
        <text id="steer-label" x="1060" y="940" font-size="52" font-weight="700" fill="#e6edf3" stroke="none" opacity="0">steer</text>

        <!-- cost meter -->
        <text id="steer-cost" x="1260" y="850" font-size="52" font-weight="700" fill="#e6edf3" stroke="none" opacity="0">live cost</text>
        <g id="steer-meter" stroke="none" opacity="0">
          <rect class="steer-seg" x="1260" y="880" width="40" height="40" rx="6" fill="#2a3340" />
          <rect class="steer-seg" x="1310" y="880" width="40" height="40" rx="6" fill="#2a3340" />
          <rect class="steer-seg" x="1360" y="880" width="40" height="40" rx="6" fill="#2a3340" />
          <rect class="steer-seg" x="1410" y="880" width="40" height="40" rx="6" fill="#2a3340" />
          <rect class="steer-seg" x="1460" y="880" width="40" height="40" rx="6" fill="#2a3340" />
          <rect class="steer-seg" x="1510" y="880" width="40" height="40" rx="6" fill="#2a3340" />
          <rect class="steer-seg" x="1560" y="880" width="40" height="40" rx="6" fill="#2a3340" />
          <rect class="steer-seg" x="1610" y="880" width="40" height="40" rx="6" fill="#2a3340" />
          <rect id="steer-lit0" x="1260" y="880" width="40" height="40" rx="6" fill="#7ee2b8" opacity="0" />
          <rect id="steer-lit1" x="1310" y="880" width="40" height="40" rx="6" fill="#7ee2b8" opacity="0" />
          <rect id="steer-lit2" x="1360" y="880" width="40" height="40" rx="6" fill="#7ee2b8" opacity="0" />
          <rect id="steer-lit3" x="1410" y="880" width="40" height="40" rx="6" fill="#7ee2b8" opacity="0" />
          <rect id="steer-lit4" x="1460" y="880" width="40" height="40" rx="6" fill="#7ee2b8" opacity="0" />
          <rect id="steer-lit5" x="1510" y="880" width="40" height="40" rx="6" fill="#7ee2b8" opacity="0" />
          <rect id="steer-lit6" x="1560" y="880" width="40" height="40" rx="6" fill="#7ee2b8" opacity="0" />
          <rect id="steer-lit7" x="1610" y="880" width="40" height="40" rx="6" fill="#7ee2b8" opacity="0" />
        </g>
      </g>
    </svg>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const BASE = 540;
    const BEND = -260;
    const JOIN_X = 1000;
    const STEP = 22;
    const END_X = 1660;
    const smooth = (u) => u * u * (3 - 2 * u);
    const lineY = (x, k) => (x <= JOIN_X ? BASE : BASE + k * smooth((x - JOIN_X) / (END_X - JOIN_X)));
    const pointsFor = (k) => {
      const pts = ["260," + BASE, JOIN_X + "," + BASE];
      for (let x = JOIN_X + STEP; x <= END_X; x += STEP) pts.push(x + "," + lineY(x, k).toFixed(1));
      pts.push(END_X + "," + lineY(END_X, k).toFixed(1));
      return pts.join(" ");
    };

    const RUN_START = 0.5;
    const SPEED = (END_X - 260) / 3.4;
    const passAt = (x) => RUN_START + (x - 260) / SPEED;
    const steerAt = passAt(JOIN_X);

    document.querySelector("#steer-line").setAttribute("points", pointsFor(0));

    tl.fromTo("#steer-line", { attr: { points: pointsFor(0) }, opacity: 0 }, { attr: { points: pointsFor(0) }, opacity: 1, duration: 0.4 }, 0.1);
    tl.fromTo("#steer-start, #steer-end, #steer-r0, #steer-r1, #steer-r2, #steer-r3", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.2);
    tl.fromTo("#steer-meter, #steer-cost", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.6);

    // the running turn
    tl.fromTo("#steer-dot", { attr: { cx: 260, cy: BASE } }, { attr: { cx: JOIN_X, cy: BASE }, duration: steerAt - RUN_START, ease: "none", immediateRender: false }, RUN_START);
    let t = steerAt;
    for (let x = JOIN_X; x < END_X; x += STEP) {
      const nx = Math.min(x + STEP, END_X);
      tl.fromTo("#steer-dot", { attr: { cx: x, cy: lineY(x, BEND) } }, { attr: { cx: nx, cy: lineY(nx, BEND) }, duration: (nx - x) / SPEED, ease: "none", immediateRender: false }, t);
      t += (nx - x) / SPEED;
    }

    // the steer arrow joins mid-flight and the line bends toward it
    tl.fromTo("#steer-arrow", { x: JOIN_X, y: 960 }, { x: JOIN_X, y: BASE + 95, duration: steerAt - 1.2, ease: "power2.in" }, 1.2);
    tl.fromTo("#steer-arrow", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 1.2);
    tl.fromTo("#steer-label", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.2);
    tl.to("#steer-arrow, #steer-label", { opacity: 0, duration: 0.3 }, steerAt + 0.3);
    tl.fromTo("#steer-line", { attr: { points: pointsFor(0) } }, { attr: { points: pointsFor(BEND) }, duration: 0.6, ease: "power2.inOut", immediateRender: false }, steerAt);
    tl.fromTo("#steer-end", { attr: { cy: BASE } }, { attr: { cy: lineY(END_X, BEND) }, duration: 0.6, ease: "power2.inOut", immediateRender: false }, steerAt);
    [2, 3].forEach((i) => {
      const x = i === 2 ? 1220 : 1580;
      tl.fromTo("#steer-r" + i, { attr: { cy: BASE } }, { attr: { cy: lineY(x, BEND) }, duration: 0.6, ease: "power2.inOut", immediateRender: false }, steerAt);
    });

    // each model call lights two meter segments
    [500, 860, 1220, 1580].forEach((x, i) => {
      const at = passAt(x);
      tl.fromTo("#steer-r" + i, { stroke: "#7d8a94" }, { stroke: "#7ee2b8", duration: 0.2, immediateRender: false }, at);
      tl.fromTo("#steer-lit" + 2 * i + ", #steer-lit" + (2 * i + 1), { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.12, immediateRender: false }, at + 0.05);
    });

    tl.to("#steer-scene", { opacity: 0, duration: 0.4, ease: "power2.in" }, 4.1);
    window.__timelines["steer"] = tl;
  </script>
</template>
