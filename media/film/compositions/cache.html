<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: "JetBrains Mono", monospace;
    }
    #cache-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
  <div id="root" data-composition-id="cache" data-width="1920" data-height="1080">
    <svg id="cache-svg" viewBox="0 0 1920 1080">
      <defs>
        <filter id="cache-glow" x="-20%" y="-60%" width="140%" height="220%">
          <feGaussianBlur stdDeviation="16" result="b" />
          <feMerge>
            <feMergeNode in="b" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
      <g id="cache-scene" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- the request: five cached segments, then four that change -->
        <g id="cache-front" filter="url(#cache-glow)">
          <rect x="274" y="300" width="140" height="110" rx="12" fill="#7ee2b8" />
          <rect x="428" y="300" width="140" height="110" rx="12" fill="#7ee2b8" />
          <rect x="582" y="300" width="140" height="110" rx="12" fill="#7ee2b8" />
          <rect x="736" y="300" width="140" height="110" rx="12" fill="#7ee2b8" />
          <rect x="890" y="300" width="140" height="110" rx="12" fill="#7ee2b8" />
        </g>
        <g id="cache-tail" stroke="#7d8a94" stroke-width="4">
          <rect x="1044" y="300" width="140" height="110" rx="12" />
          <rect x="1198" y="300" width="140" height="110" rx="12" />
          <rect id="cache-seg7" x="1352" y="300" width="140" height="110" rx="12" />
          <rect x="1506" y="300" width="140" height="110" rx="12" />
        </g>
        <path id="cache-bracket" d="M274 450 H1030 M274 438 V462 M1030 438 V462" stroke="#7ee2b8" stroke-width="4" pathLength="1" />

        <!-- the menu -->
        <path id="cache-link" d="M1422 560 V420" stroke="#2a3340" stroke-width="4" />
        <rect id="cache-menu" x="1044" y="560" width="602" height="300" rx="20" stroke="#e6edf3" stroke-width="4" fill="#0d1117" />
        <g id="cache-slots" stroke="#2a3340" stroke-width="3" stroke-dasharray="10 10">
          <rect x="1068" y="584" width="554" height="52" rx="10" />
          <rect x="1068" y="652" width="554" height="52" rx="10" />
          <rect x="1068" y="720" width="554" height="52" rx="10" />
          <rect x="1068" y="788" width="554" height="52" rx="10" />
        </g>
        <rect id="cache-pulse" x="1044" y="560" width="602" height="300" rx="20" stroke="#e6edf3" stroke-width="4" opacity="0" />

        <!-- plug-ins: servers (square with prongs) and skills (diamond) -->
        <g id="cache-i0" stroke="#e6edf3" stroke-width="4">
          <rect x="-16" y="-16" width="32" height="32" rx="6" fill="#0d1117" />
          <path d="M-16 -7 H-26 M-16 7 H-26" />
        </g>
        <g id="cache-i1" stroke="#e6edf3" stroke-width="4">
          <path d="M0 -20 L20 0 L0 20 L-20 0 Z" fill="#0d1117" />
        </g>
        <g id="cache-i2" stroke="#e6edf3" stroke-width="4">
          <rect x="-16" y="-16" width="32" height="32" rx="6" fill="#0d1117" />
          <path d="M-16 -7 H-26 M-16 7 H-26" />
        </g>
        <g id="cache-i3" stroke="#e6edf3" stroke-width="4">
          <path d="M0 -20 L20 0 L0 20 L-20 0 Z" fill="#0d1117" />
        </g>

        <text id="cache-label" x="960" y="985" text-anchor="middle" font-size="52" font-weight="700" fill="#e6edf3" stroke="none">cache stays warm</text>
      </g>
    </svg>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const slotX = 1100;
    const slotY = (i) => 610 + i * 68;
    const plugAt = [1.8, 3.0, 4.2, 5.4];

    tl.fromTo("#cache-tail rect", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.2);
    tl.fromTo("#cache-front rect", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.2);
    tl.fromTo("#cache-bracket", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0.9);
    tl.fromTo("#cache-label", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.9);
    tl.fromTo("#cache-menu, #cache-slots, #cache-link", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.8);

    for (let i = 0; i < 4; i++) {
      const startX = 330 + i * 110;
      tl.fromTo("#cache-i" + i, { x: startX, y: 720, opacity: 0 }, { x: startX, y: 720, opacity: 1, duration: 0.4 }, 0.9 + i * 0.1);
      tl.fromTo("#cache-i" + i, { x: startX, y: 720 }, { x: slotX, y: slotY(i), duration: 0.9, ease: "power2.inOut", immediateRender: false }, plugAt[i] - 0.4);
      tl.fromTo("#cache-pulse", { opacity: 0.9, scale: 1, svgOrigin: "1345 710" }, { opacity: 0, scale: 1.07, svgOrigin: "1345 710", duration: 0.6, ease: "power2.out", immediateRender: false }, plugAt[i] + 0.5);
      tl.fromTo("#cache-seg7", { stroke: "#7d8a94" }, { stroke: "#e6edf3", duration: 0.2, yoyo: true, repeat: 1, immediateRender: false }, plugAt[i] + 0.5);
    }

    tl.to("#cache-scene", { opacity: 0, duration: 0.4, ease: "power2.in" }, 6.6);
    window.__timelines["cache"] = tl;
  </script>
</template>
