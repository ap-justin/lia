<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0d1117;
      }
      #bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 50% 40%, #131a22 0%, #0d1117 70%),
          #0d1117;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg"></div>
      <div
        id="bin"
        data-composition-id="bin"
        data-composition-src="compositions/bin.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="acp"
        data-composition-id="acp"
        data-composition-src="compositions/acp.html"
        data-start="4"
        data-duration="6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="cache"
        data-composition-id="cache"
        data-composition-src="compositions/cache.html"
        data-start="10"
        data-duration="7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="retry"
        data-composition-id="retry"
        data-composition-src="compositions/retry.html"
        data-start="17"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="steer"
        data-composition-id="steer"
        data-composition-src="compositions/steer.html"
        data-start="22"
        data-duration="4.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="close"
        data-composition-id="close"
        data-composition-src="compositions/close.html"
        data-start="26.5"
        data-duration="3.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
